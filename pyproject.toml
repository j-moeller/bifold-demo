[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifold-demo"
version = "0.1.0"
description = "Real-time YOLO object detection on a webcam or a customizable rendered 3D scene"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "moderngl>=5.8",
    "ultralytics>=8.4",
]

[project.optional-dependencies]
# text-to-image models for generating people (bifold-people generate)
people = ["diffusers>=0.42", "transformers>=4.51", "accelerate>=1.0", "safetensors"]
dev = ["pytest>=7"]

[project.scripts]
bifold-demo = "bifold_demo.app:main"
bifold-people = "bifold_demo.people.cli:main"
bifold-characters = "bifold_demo.characters.cli:main"
bifold-faces = "bifold_demo.recognition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bifold_demo.characters" = ["*.json"]
"bifold_demo.characters.outfit" = ["*.json", "overrides/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gl: needs an OpenGL 3.3 context",
    "yolo: runs the YOLO model (downloads weights on first use)",
]

[tool.ruff]
line-length = 120
