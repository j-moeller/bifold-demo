[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifold-morph"
version = "0.1.0"
description = "Live webcam face changing with age and gender sliders (a U-Net distilled from StyleGAN2 edits)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.14",
    "onnx>=1.17",
    "onnx2torch>=1.5.15",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bifold-morph = "bifold_morph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bifold_morph" = ["weights/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds the full-size networks (a few seconds each on a CPU)",
]

[tool.ruff]
line-length = 120
